# ============================================================
# BASE CONFIGURATION — Hett Phase 1 Research System
# ============================================================

project:
  name: "hett_phase1"
  version: "0.1.0"
  random_seed: 42

data:
  symbol: "^NSEI"
  provider: "yfinance"
  interval: "1d"
  # Leave blank to use maximum available history
  start_date: null
  end_date: null
  # Force re-download even if cache exists
  force_refresh: false
  retry_attempts: 5
  retry_backoff_seconds: 2.0
  # Yahoo Finance volume for ^NSEI index is unreliable; disable volume-based signals
  nsei_volume_reliable: false

splits:
  # Proportions must sum to 1.0
  development: 0.60
  validation:  0.20
  test:        0.20
  # Extra embargo bars after each fold (linked to max forward horizon)
  embargo_bars: 20

walk_forward:
  # Minimum bars in each training window
  min_train_bars: 252
  # Number of out-of-sample bars per step
  step_bars: 63
  # Expanding (true) or rolling (false) window
  expanding: true

capital:
  initial: 1000000   # INR 10,00,000
  currency: "INR"
  max_leverage: 1.0

forward_return_horizons: [1, 3, 5, 10, 20]

regimes:
  trend:
    sma_window: 200
    slope_window: 63
    # Percentile thresholds for slope classification (fitted on train)
    bear_slope_pct: 33
    bull_slope_pct: 67
  volatility:
    atr_window: 14
    percentile_window: 252
    low_pct: 33
    high_pct: 67
  structure:
    adx_window: 14
    adx_trending_threshold: 25
    efficiency_window: 20

outputs:
  base_dir: "outputs"
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"
  experiments_dir: "outputs/experiments"
  reports_dir: "outputs/reports"

logging:
  level: "INFO"
  format: "rich"
